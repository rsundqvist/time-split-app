name: tests

on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Log level"
        required: true
        default: "info"
      tags:
        required: false
        description: "Test scenario tags"
  push:
    branches:
      - master
      - ci/*
  pull_request:
    branches:

env:
  POLARS_SKIP_CPU_CHECK: true

jobs:
  linting:
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14 with uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.14'

      - name: Install linting tools
        run: uv sync --locked --only-group devops

      - name: Linting
        run: uv run --no-sync inv lint

  tests:
    needs: linting
    name: ${{ matrix.os }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      matrix:
        os: [ Ubuntu ]
        python-version: [ '3.11', '3.12', '3.13', '3.14' ]
        experimental: [ false ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }} with uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install nox
        run: uv sync --locked --only-group devops

      - name: Run mypy with nox
        shell: bash
        run: uv run --no-sync nox --force-color -s mypy-${{ matrix.python-version }}

      - name: Run tests with nox
        shell: bash
        run: uv run --no-sync nox --force-color -s tests-${{ matrix.python-version }}
