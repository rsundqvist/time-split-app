name: time-split

services:
  app:
    image: time-split:dev
    ports:
      - "8501:8501"
    env_file: ./common.env
    environment:
      DEBUG: false
      EXTRA_PIP_PACKAGES: s3fs plotly
      REQUIRE_DATASETS: true
      DATASETS_CONFIG_PATH: s3://my-bucket/data/remote-datasets.toml
    network_mode: host
    volumes:
      - ../app_extensions.py:/home/streamlit/app_extensions.py:ro,z

  s3:
    image: docker.io/chrislusf/seaweedfs:4.47
    command: [ "server", "-s3" ]
    environment:
      AWS_ACCESS_KEY_ID: s3admin
      AWS_SECRET_ACCESS_KEY: s3admin
    ports:
      - "9000:8333"
    healthcheck:
      test: [ "CMD", "nc", "-z", "127.0.0.1", "8333" ]
      interval: 2s
      timeout: 2s
      retries: 15
